services:
  - type: web
    name: clearremit-iso20022-engine
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/sample
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
