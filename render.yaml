services:
  - type: web
    name: clearremit-iso20022-engine
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: clearremit-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: CLEARREMIT_DB_PATH
        value: /app/data/workspace.sqlite3
      - key: CLEARREMIT_REQUIRE_AUTH
        value: "1"
      - key: CLEARREMIT_USERNAME
        sync: false
      - key: CLEARREMIT_PASSWORD
        sync: false
