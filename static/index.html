<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearLedger Prime v5 — Modular Multi-Currency Financial OS</title>
  <link rel="stylesheet" href="/static/css/theme.css" />
</head>
<body>
  <aside>
    <div class="brand">
      <div class="brand-top">
        <span class="brand-tag">v5.0 MODULAR OS</span>
        <span class="kbd" id="cmdTriggerBtn" style="cursor:pointer">Ctrl+K</span>
      </div>
      <h1>ClearLedger Prime</h1>
      <p>Tally + Finacle Core • GB-Scale Engine</p>
    </div>

    <div class="nav-group-label">Core Accounting</div>
    <button class="nav-btn active" id="navDashboard"><span>Command Center</span><span class="kbd">Alt+1</span></button>
    <button class="nav-btn" id="navVouchers"><span>Vouchers &amp; Daybook</span><span class="kbd">Alt+2</span></button>
    <button class="nav-btn" id="navCoa"><span>Chart of Accounts</span><span class="kbd">Alt+3</span></button>

    <div class="nav-group-label">Treasury, FX &amp; Tax</div>
    <button class="nav-btn" id="navFx"><span>FX &amp; IAS 21 Reval</span><span class="kbd">Alt+4</span></button>
    <button class="nav-btn" id="navRemit"><span>Remittance &amp; DTAA</span><span class="kbd">Alt+5</span></button>
    <button class="nav-btn" id="navInvest"><span>Investment Tax-Lots</span><span class="kbd">Alt+6</span></button>

    <div class="nav-group-label">Reporting &amp; Scale</div>
    <button class="nav-btn" id="navStatements"><span>Statements &amp; Aging</span><span class="kbd">Alt+7</span></button>
    <button class="nav-btn" id="navBulk"><span>⚡ GB Data Streamer</span><span class="kbd">Alt+8</span></button>

    <div class="sidebar-telemetry">
      <div style="font-weight:700; color:#e2e8f0; margin-bottom:6px;"><span class="dot-green"></span>SQLite WAL Engine</div>
      <div class="telemetry-row"><span>API Latency</span><b class="num" id="telLatency" style="color:var(--cyan)">— ms</b></div>
      <div class="telemetry-row"><span>Total Vouchers</span><b class="num" id="telVouchers">—</b></div>
      <div class="telemetry-row"><span>GL Invariant</span><b id="telBalance" style="color:var(--emerald)">✓ 0.00 Var</b></div>
      <button id="resetDemoBtn" style="width:100%; margin-top:8px; padding:6px; font-size:11px;">↻ Reset Demo Ledger</button>
    </div>
  </aside>

  <main id="appStage">
    <div style="padding:40px; color:var(--muted);">Booting ClearLedger Prime v5.0 Modular Financial OS...</div>
  </main>

  <!-- Global Command Palette (Ctrl+K) -->
  <div id="cmdModal" class="modal-backdrop hidden">
    <div class="cmd-modal">
      <input id="cmdSearch" class="cmd-input" placeholder="Jump to module, GL ledger, or action..." />
      <div id="cmdList"></div>
    </div>
  </div>

  <!-- Tally-Style Running-Balance Account Ledger Drill-Down Drawer -->
  <div id="ledgerDrawerBackdrop" class="drawer-backdrop hidden">
    <div class="drawer-panel" id="ledgerDrawerBody"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/static/js/app_shell.js"></script>
</body>
</html>
